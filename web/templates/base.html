<!doctype html>
<html lang="en" data-bs-theme="dark">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <meta name="description" content="FoodAlgo predicts your next meal from your meal history with machine learning.">
    <meta name="google-site-verification" content="FWcNjRyFverWnIwjebGAaGrlbIUphw-xR408L7uTqoc" />
    <link rel="icon" href="{{ url_for('static', filename='favicon.ico') }}">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet"
          integrity="sha384-QWTKZyjpPEjISv5WaRU9OFeRpok6YctnYmDr5pNlyT2bRjXh0JMhjY6hW+ALEwIH" crossorigin="anonymous">
    <style>
      :root, [data-bs-theme=dark] { --accent: #00cc66; --bs-body-bg: #121614; --bs-body-color: #e8efe9; }
      body { background: radial-gradient(circle at 20% -10%, #133322 0, transparent 45%), var(--bs-body-bg); min-height: 100vh; }
      .brand { font-family: ui-monospace, SFMono-Regular, Menlo, monospace; color: var(--accent) !important; font-weight: 700; }
      .card { background: #1a201c; border: 1px solid #25302a; border-radius: 1rem; }
      .text-accent { color: var(--accent); }
      .btn-accent { --bs-btn-bg: var(--accent); --bs-btn-border-color: var(--accent); --bs-btn-color: #04150c;
        --bs-btn-hover-bg: #00b359; --bs-btn-hover-border-color: #00b359; --bs-btn-hover-color: #04150c;
        --bs-btn-active-bg: #00b359; --bs-btn-active-border-color: #00b359; --bs-btn-active-color: #04150c;
        --bs-btn-disabled-bg: #1f5d3e; --bs-btn-disabled-border-color: #1f5d3e; font-weight: 600; }
      .form-control, .form-select { background-color: #121614; border-color: #2c3a31; }
      .history { max-height: 360px; overflow-y: auto; }
      .history thead th { position: sticky; top: 0; background: #1a201c; }
      .prediction { border-radius: .75rem; background: #121614; padding: .75rem 1rem; }
      .prediction .bar { height: .4rem; border-radius: 1rem; background: var(--accent); }
    </style>
    <title>{% block title %}FoodAlgo{% endblock %}</title>
  </head>
  <body>
    <nav class="navbar border-bottom border-dark-subtle">
      <div class="container">
        <a class="navbar-brand brand" href="{{ url_for('view.home') }}">🍽️ FoodAlgo</a>
        <a class="nav-link text-secondary" href="{{ url_for('view.more') }}">Help</a>
      </div>
    </nav>
    <main class="container py-4">{% block content %}{% endblock %}</main>
    <footer class="text-center text-secondary small pb-4">
      Your data stays in your browser. · Made by <a class="text-accent" href="https://prasannan-robots.github.io/" target="_blank" rel="noopener">prasannan-robots</a>
    </footer>
    {% block scripts %}{% endblock %}
  </body>
</html>
